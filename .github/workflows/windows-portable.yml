# Solo la versión portable de Windows: sin instalador, sin MSI/NSIS.
# Cada push a main (que toque la app) y cada ejecución manual genera
# un único .exe portable y lo publica como Release (no como artefacto,
# para no depender de la cuota de almacenamiento de Actions).
name: Windows portable

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Build web (Vite)
        run: bun run build

      - name: Empaquetar portable Windows
        run: npx electron-builder --win portable

      - name: Publicar .exe como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "No se encontró ningún .exe en release/"; exit 1 }
          gh release create "win-portable-${{ github.run_number }}" $exe.FullName --title "Visor de Tomografía — Windows portable (build ${{ github.run_number }})" --notes "Portable para Windows, sin instalador. Construido desde el commit ${{ github.sha }}."
